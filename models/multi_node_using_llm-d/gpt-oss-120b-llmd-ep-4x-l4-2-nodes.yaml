# gpt-oss-120b split across 4x L4 24GB on 2 nodes (2 GPUs per node) using
# llm-d wide expert parallelism: DP=2 x TP=2 x EP, one DP rank per node via LeaderWorkerSet.
# Experts are sharded across all 4 GPUs (EP size = DP x TP = 4, 32 experts per GPU);
# attention layers and the KV cache are tensor-parallel split across the 2 GPUs in each node.
#
# UNTESTED - derived from the working 4x L4 / 4 node config (gpt-oss-120b-llmd-ep-4x-l4.yaml).
# Sizing estimate, extrapolated from that run (19.63GiB weights, 0.72GiB KV cache per GPU):
#   TP=2 halves the attention weights (~0.9GiB saved per GPU) and halves the KV cache
#   bytes/token per GPU, so ~1.6GiB KV per GPU should hold ~180k tokens - enough for the
#   full 131072 context at ~1.3x concurrency, with only ~0.5GiB of margin per GPU.
# If a rank reports negative "Available KV cache memory" or fails the max-model-len check,
# drop --max-model-len to 65536.
#
# Total parallelism is immutable: delete the existing LLMInferenceService before
# switching between variants.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    opendatahub.io/genai-use-case: 'chat, tools'
    opendatahub.io/model-type: generative
    openshift.io/display-name: gpt-oss-120b
    security.opendatahub.io/enable-auth: 'false'
  name: gpt-oss-120b
  namespace: models
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
spec:
  model:
    name: gpt-oss-120b
    uri: 'oci://registry.redhat.io/rhai/modelcar-gpt-oss-120b-essential:3.0'
  replicas: 1
  parallelism:
    data: 2          # total DP ranks (one per node)
    dataLocal: 1     # DP ranks per pod
    tensor: 2        # GPUs per DP rank (2 GPUs per node)
    expert: true     # shard MoE experts across all DP x TP ranks
  router:
    scheduler: {}    # llm-d inference scheduler (EPP) with preset defaults
    route: {}        # managed HTTPRoute attaching the InferencePool to the gateway
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: '--max-model-len=131072 --gpu-memory-utilization=0.98 --max-num-seqs=16 --max-num-batched-tokens=1024 --max-cudagraph-capture-size=32 --kv-cache-dtype=fp8 --enable-auto-tool-choice --tool-call-parser=openai --reasoning-parser=openai_gptoss'
          - name: VLLM_API_SERVER_COUNT
            value: '4'
        # Leader waits for all DP ranks; first-time modelcar pulls (~65GB) on workers
        # can exceed the template's 10m startup window and trigger a group restart.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 10
          failureThreshold: 360
        resources:
          limits:
            cpu: '14'
            memory: 96Gi
            nvidia.com/gpu: '2'
          requests:
            cpu: '8'
            memory: 32Gi
            nvidia.com/gpu: '2'
  worker:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: '--max-model-len=131072 --gpu-memory-utilization=0.98 --max-num-seqs=16 --max-num-batched-tokens=1024 --max-cudagraph-capture-size=32 --kv-cache-dtype=fp8'
        resources:
          limits:
            cpu: '14'
            memory: 96Gi
            nvidia.com/gpu: '2'
          requests:
            cpu: '8'
            memory: 32Gi
            nvidia.com/gpu: '2'
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: gpt-oss-120b
  namespace: models
  labels:
    inferenceservice-name: gpt-oss-120b
  annotations:
    haproxy.router.openshift.io/timeout: 30000s
    openshift.io/host.generated: 'true'
spec:
  to:
    kind: Service
    name: gpt-oss-120b-kserve-workload-svc
    weight: 100
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
