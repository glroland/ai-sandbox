apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: airgap-test-gpt-oss-120b-egress-deny
spec:
  priority: 10
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: models
      podSelector:
        matchLabels:
          serving.kserve.io/inferenceservice: gpt-oss-120b-epyc
  egress:
    - name: "allow-cluster-and-service-network"
      action: Allow
      to:
        - networks: ["10.128.0.0/14", "172.30.0.0/16"]
    - name: "deny-all-other-egress"
      action: Deny
      to:
        - networks: ["0.0.0.0/0"]
