apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    opendatahub.io/genai-use-case: 'chat, tools'
    opendatahub.io/hardware-profile-name: amd-epyc
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: gpt-oss-120b-epyc
    security.opendatahub.io/enable-auth: 'false'
  name: gpt-oss-120b-epyc
  namespace: models
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
spec:
  baseRefs:
    - name: gpt-oss-120b-epyc-config
  model:
    name: gpt-oss-120b-epyc
    uri: 'oci://registry.redhat.io/rhai/modelcar-gpt-oss-120b-essential:3.0'
  replicas: 1
  template:
    containers:
      - env:
          - name: VLLM_ADDITIONAL_ARGS
            value: '--max-model-len=131072 --enable-auto-tool-choice --tool-call-parser=openai --reasoning-parser=openai_gptoss'
        name: main
        resources:
          limits:
            cpu: '60'
            memory: 220Gi
          requests:
            cpu: '32'
            memory: 192Gi
    nodeSelector:
      feature.node.kubernetes.io/cpu-cpuid.AVX512VNNI: 'true'
      feature.node.kubernetes.io/cpu-model.vendor_id: AMD
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  annotations:
    platform.opendatahub.io/instance.name: default-kserve
    openshift.io/description: vLLM CPU (AMD EPYC) LLMInferenceServiceConfig for the gpt-oss-120b-epyc LLMInferenceService.
    openshift.io/display-name: gpt-oss-120b-epyc Config - vLLM CPU [AMD EPYC]
    serving.kserve.io/well-known-config: 'true'
  name: gpt-oss-120b-epyc-config
  namespace: models
  labels:
    app.kubernetes.io/part-of: kserve
    app.opendatahub.io/kserve: 'true'
    opendatahub.io/config-type: accelerator
    platform.opendatahub.io/part-of: kserve
spec:
  template:
    containers:
      - image: 'quay.io/redhat-ai-americas/vllm-cpu-rhel9-epyc-offline:20261010-2000'
        name: main
        env:
          - name: HF_HOME
            value: /tmp/hf_home
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: gpt-oss-120b-epyc
  namespace: models
  labels:
    inferenceservice-name: gpt-oss-120b-epyc
  annotations:
    haproxy.router.openshift.io/timeout: 30000s
    openshift.io/host.generated: 'true'
spec:
  to:
    kind: Service
    name: gpt-oss-120b-epyc-kserve-workload-svc
    weight: 100
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
