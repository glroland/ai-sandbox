apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/disabled: "false"
    opendatahub.io/display-name: AMD EPYC
  name: amd-epyc
  namespace: redhat-ods-applications
spec:
  identifiers:
    - defaultCount: 2
      displayName: CPU
      identifier: cpu
      minCount: 1
      resourceType: CPU
    - defaultCount: 4Gi
      displayName: Memory
      identifier: memory
      minCount: 2Gi
      resourceType: Memory
  scheduling:
    node:
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX512VNNI: "true"
        feature.node.kubernetes.io/cpu-model.vendor_id: AMD
      tolerations: []
    type: Node
