apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/accelerator-name: ''
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: v0.10.1.1
    opendatahub.io/serving-runtime-scope: global
    opendatahub.io/template-display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    opendatahub.io/template-name: vllm-cuda-runtime
    openshift.io/display-name: {{ modelName }}
  name: {{ modelName }}
  namespace: {{ modelNamespace }}
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  containers:
    - args:
        - '--port=8080'
        - '--model=/mnt/models'
        - '--served-model-name={{.Name}}'
      command:
        - python
        - '-m'
        - vllm.entrypoints.openai.api_server
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      image: 'registry.redhat.io/rhoai/odh-vllm-cuda-rhel9@sha256:fb84fbf103bf450ef5b060fc5f21a9cf16b166dba207a3c50aa91bccd919d604'
      name: kserve-container
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 2Gi
      name: shm
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    opendatahub.io/hardware-profile-name: {{ sizeProfile }}
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    openshift.io/display-name: {{ modelName }}
    security.opendatahub.io/enable-auth: 'true'
    serving.kserve.io/deploymentMode: RawDeployment
  name: {{ modelName }}
  namespace: {{ modelNamespace }}
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '2'
          memory: 4Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '2'
          memory: 4Gi
          nvidia.com/gpu: '1'
      runtime: {{ modelName }}
      storage:
        key: {{ connectionInfo }}
        path: {{ modelType }}
    nodeSelector:
      nvidia.com/gpu.product: {{ hardwareType }}
---
kind: Secret
apiVersion: v1
metadata:
  name: {{ connectionInfo }}
  namespace: models
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/managed: 'true'
  annotations:
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/description: ''
    openshift.io/display-name: {{ connectionInfo }}
stringData:
  AWS_ACCESS_KEY_ID: 
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_BUCKET: llms
  AWS_S3_ENDPOINT: https://10.247.4.95
  AWS_SECRET_ACCESS_KEY: 
  S3_VERIFY_SSL: "false"
type: Opaque
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ modelName }}-view-role
  namespace: {{ modelNamespace }}
  labels:
    opendatahub.io/dashboard: 'true'
  ownerReferences:
    - apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      name: {{ modelName }}
      blockOwnerDeletion: false
rules:
  - verbs:
      - get
    apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
    resourceNames:
      - {{ modelName }}
