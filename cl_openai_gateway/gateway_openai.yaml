apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openai-gateway
  namespace: sandbox
spec:
  gatewayClassName: istio
  listeners:

  - name: openai-endpoint
    protocol: HTTPS
    port: 443
    hostname: "api.openai.com"
    allowedRoutes:
      namespaces:
        from: All
