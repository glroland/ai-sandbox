# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: quay.io/rh-aiservices-bu/docling-service
  tag: latest
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Replicas
# ---------------------------------------------------------------------------
replicaCount: 1

# ---------------------------------------------------------------------------
# Application configuration (rendered into a ConfigMap)
# ---------------------------------------------------------------------------
config:
  # Compute device: cpu | cuda | mps
  device: cpu
  # OCR engine: rapidocr | easyocr | tesseract
  ocrEngine: rapidocr
  # Python log level: DEBUG | INFO | WARNING | ERROR | CRITICAL
  logLevel: INFO
  # Maximum accepted upload size in megabytes
  maxFileSizeMb: "50"
  # Enable FastAPI debug mode
  debug: "false"
  # Number of OpenMP threads used by the inference runtime
  ompNumThreads: "4"

# ---------------------------------------------------------------------------
# GPU support
# When gpu.enabled=true the Deployment requests one nvidia.com/gpu,
# sets device=cuda in the ConfigMap, and adds the GPU node selector.
# ---------------------------------------------------------------------------
gpu:
  enabled: false
  resourceName: nvidia.com/gpu
  count: 1
  nodeSelector:
    nvidia.com/gpu.present: "true"

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080

# ---------------------------------------------------------------------------
# OpenShift Route
# ---------------------------------------------------------------------------
route:
  enabled: true
  # Leave host empty to let OpenShift auto-generate the hostname.
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# Resource requests / limits
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  # Override the generated name; leave empty to use the chart release name.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Pod-level settings
# ---------------------------------------------------------------------------
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
