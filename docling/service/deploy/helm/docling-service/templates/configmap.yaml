apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docling-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docling-service.labels" . | nindent 4 }}
data:
  # Compute device — overridden to "cuda" when gpu.enabled=true
  DEVICE: {{ include "docling-service.device" . | quote }}
  # OCR engine
  OCR_ENGINE: {{ .Values.config.ocrEngine | quote }}
  # Python logging level
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # Maximum upload size (MB)
  MAX_FILE_SIZE_MB: {{ .Values.config.maxFileSizeMb | quote }}
  # FastAPI debug mode
  DEBUG: {{ .Values.config.debug | quote }}
  # OpenMP thread count for inference
  OMP_NUM_THREADS: {{ .Values.config.ompNumThreads | quote }}
