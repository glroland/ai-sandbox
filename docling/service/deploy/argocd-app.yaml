apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docling-service
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: docling-service
    app.kubernetes.io/part-of: ai-sandbox
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Update this to your fork/clone of the repository.
    repoURL: https://github.com/ai-sandbox/docling.git
    targetRevision: HEAD
    path: service/deploy/helm/docling-service

    helm:
      # Override individual values here or point to a values file per environment.
      # Example overrides — remove or adjust as needed:
      values: |
        image:
          repository: quay.io/rh-aiservices-bu/docling-service
          tag: latest

        config:
          device: cpu
          ocrEngine: rapidocr
          logLevel: INFO
          maxFileSizeMb: "50"
          ompNumThreads: "4"

        replicaCount: 1

        route:
          enabled: true
          tls:
            enabled: true
            termination: edge
            insecureEdgeTerminationPolicy: Redirect

  destination:
    server: https://kubernetes.default.svc
    namespace: docling

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
