# PIPELINE DEFINITION
# Name: upload-directory-op
# Description: Upload every file in *input_dir* to *container_name*.
#              Each file is stored as ``{blob_prefix}/{relative_path}`` where
#              *relative_path* is the file's path relative to *input_dir*.
# Inputs:
#    blob_prefix: str
#    container_name: str
#    input_dir: system.Dataset
#    storage_account: str [Default: '']
#    storage_key: str [Default: '']
components:
  comp-upload-directory-op:
    executorLabel: exec-upload-directory-op
    inputDefinitions:
      artifacts:
        input_dir:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        blob_prefix:
          parameterType: STRING
        container_name:
          parameterType: STRING
        storage_account:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        storage_key:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
deploymentSpec:
  executors:
    exec-upload-directory-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_directory_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_directory_op(\n    container_name: str,\n    blob_prefix:\
          \ str,\n    input_dir: Input[Dataset],\n    storage_account: str = \"\"\
          ,\n    storage_key: str = \"\",\n) -> None:\n    \"\"\"\n    Upload every\
          \ file in *input_dir* to *container_name*.\n\n    Each file is stored as\
          \ ``{blob_prefix}/{relative_path}`` where\n    *relative_path* is the file's\
          \ path relative to *input_dir*.\n\n    Parameters\n    ----------\n    container_name\
          \  : destination container\n    blob_prefix     : prefix prepended to every\
          \ uploaded blob name\n    input_dir       : input artifact directory whose\
          \ files are uploaded\n    storage_account : override AZURE_STORAGE_ACCOUNT\
          \ env var (optional)\n    storage_key     : override AZURE_STORAGE_KEY env\
          \ var (optional)\n    \"\"\"\n    import base64, datetime, hashlib, hmac,\
          \ os\n    from urllib.parse import quote\n    import requests\n\n    def\
          \ _account() -> str:\n        v = storage_account or os.environ.get(\"AZURE_STORAGE_ACCOUNT\"\
          , \"\")\n        if not v:\n            raise EnvironmentError(\"AZURE_STORAGE_ACCOUNT\
          \ is not set\")\n        return v\n\n    def _key() -> str:\n        v =\
          \ storage_key or os.environ.get(\"AZURE_STORAGE_KEY\", \"\")\n        if\
          \ not v:\n            raise EnvironmentError(\"AZURE_STORAGE_KEY is not\
          \ set\")\n        return v\n\n    def _sign(s: str) -> str:\n        raw\
          \ = base64.b64decode(_key())\n        return base64.b64encode(\n       \
          \     hmac.new(raw, s.encode(\"utf-8\"), hashlib.sha256).digest()\n    \
          \    ).decode()\n\n    def _build_headers(method, container, blob=None,\
          \ extra=None, qp=None, clen=\"\"):\n        account = _account()\n     \
          \   utc = datetime.datetime.utcnow().strftime(\"%a, %d %b %Y %H:%M:%S GMT\"\
          )\n        hdrs = {\"x-ms-date\": utc, \"x-ms-version\": \"2025-11-05\"\
          }\n        if extra:\n            hdrs.update(extra)\n        ms = sorted((k.lower(),\
          \ v) for k, v in hdrs.items() if k.lower().startswith(\"x-ms-\"))\n    \
          \    canon_hdrs = \"\".join(f\"{k}:{v}\\n\" for k, v in ms)\n        resource\
          \ = f\"/{account}/{container}\"\n        if blob:\n            resource\
          \ += f\"/{blob}\"\n        if qp:\n            for k in sorted(qp):\n  \
          \              resource += f\"\\n{k}:{qp[k]}\"\n        sts = (\n      \
          \      f\"{method}\\n\\n\\n{clen}\\n\"\n            f\"{hdrs.get('Content-MD5','')}\\\
          n{hdrs.get('Content-Type','')}\\n\"\n            f\"\\n\\n\\n\\n\\n\\n{canon_hdrs}{resource}\"\
          \n        )\n        hdrs[\"Authorization\"] = f\"SharedKey {account}:{_sign(sts)}\"\
          \n        return hdrs\n\n    def _upload_file(local_path: str, blob_name:\
          \ str):\n        with open(local_path, \"rb\") as fh:\n            data\
          \ = fh.read()\n        content_length = str(len(data))\n        account\
          \ = _account()\n        url = f\"https://{account}.blob.core.windows.net/{container_name}/{quote(blob_name,\
          \ safe='/')}\"\n        extra = {\"Content-Type\": \"application/octet-stream\"\
          , \"x-ms-blob-type\": \"BlockBlob\"}\n        headers = _build_headers(\n\
          \            \"PUT\", container_name, blob=blob_name, extra=extra, clen=content_length\n\
          \        )\n        headers[\"Content-Length\"] = content_length\n     \
          \   print(f\"[INFO] Uploading {content_length} bytes -> '{container_name}/{blob_name}'\"\
          )\n        resp = requests.put(url, headers=headers, data=data)\n      \
          \  if not resp.ok:\n            print(f\"[ERROR] upload failed: {resp.status_code}\
          \ {resp.text}\")\n            resp.raise_for_status()\n        print(f\"\
          [INFO] Upload complete: '{blob_name}'\")\n\n    base_dir = input_dir.path\n\
          \    prefix = blob_prefix.rstrip(\"/\")\n    for dirpath, _, filenames in\
          \ os.walk(base_dir):\n        for filename in filenames:\n            local_path\
          \ = os.path.join(dirpath, filename)\n            rel_path = os.path.relpath(local_path,\
          \ base_dir)\n            blob_name = f\"{prefix}/{rel_path}\"\n        \
          \    _upload_file(local_path, blob_name)\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: upload-directory-op
root:
  dag:
    tasks:
      upload-directory-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-upload-directory-op
        inputs:
          artifacts:
            input_dir:
              componentInputArtifact: input_dir
          parameters:
            blob_prefix:
              componentInputParameter: blob_prefix
            container_name:
              componentInputParameter: container_name
            storage_account:
              componentInputParameter: storage_account
            storage_key:
              componentInputParameter: storage_key
        taskInfo:
          name: upload-directory-op
  inputDefinitions:
    artifacts:
      input_dir:
        artifactType:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
    parameters:
      blob_prefix:
        parameterType: STRING
      container_name:
        parameterType: STRING
      storage_account:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      storage_key:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
