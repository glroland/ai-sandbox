# PIPELINE DEFINITION
# Name: download-input-file-step
# Inputs:
#    source_document_url: str
# Outputs:
#    source_document_path: system.Artifact
components:
  comp-download-input-file-step:
    executorLabel: exec-download-input-file-step
    inputDefinitions:
      parameters:
        source_document_url:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        source_document_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-download-input-file-step:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - download_input_file_step
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_input_file_step(source_document_url: str, source_document_path:\
          \ Output[Artifact]):\n    print(\"Downloading Input File...\")\n    print(\"\
          URL: \" + str(source_document_url))\n    print(\"To: \" + str(source_document_path.path))\n\
          \n    import urllib.request\n    urllib.request.urlretrieve(source_document_url,\
          \ source_document_path.path)\n\n    print(\"Source Document Downloaded!\"\
          )\n\n"
        image: python:3.9
pipelineInfo:
  name: download-input-file-step
root:
  dag:
    outputs:
      artifacts:
        source_document_path:
          artifactSelectors:
          - outputArtifactKey: source_document_path
            producerSubtask: download-input-file-step
    tasks:
      download-input-file-step:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-input-file-step
        inputs:
          parameters:
            source_document_url:
              componentInputParameter: source_document_url
        taskInfo:
          name: download-input-file-step
  inputDefinitions:
    parameters:
      source_document_url:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      source_document_path:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
