# PIPELINE DEFINITION
# Name: detect-scanned-pdf-op
# Description: Detect whether a PDF is a scanned document that requires OCR.
#              A PDF is classified as scanned when the average number of extractable
#              characters per page falls below *chars_per_page_threshold*, which
#              indicates that the pages contain images rather than embedded text.
# Inputs:
#    chars_per_page_threshold: int [Default: 50.0]
#    input_file: system.Artifact
# Outputs:
#    Output: bool
components:
  comp-detect-scanned-pdf-op:
    executorLabel: exec-detect-scanned-pdf-op
    inputDefinitions:
      artifacts:
        input_file:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        chars_per_page_threshold:
          defaultValue: 50.0
          description: considered scanned (default 50)
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: BOOLEAN
deploymentSpec:
  executors:
    exec-detect-scanned-pdf-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - detect_scanned_pdf_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pypdf>=4.0.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef detect_scanned_pdf_op(\n    input_file: Input[Artifact],\n\n\
          \    # Minimum average characters per page to consider a PDF digitally-born\
          \ (not scanned).\n    # Pages with fewer characters than this threshold\
          \ are treated as image-only pages.\n    chars_per_page_threshold: int =\
          \ 50,\n) -> bool:\n    \"\"\"\n    Detect whether a PDF is a scanned document\
          \ that requires OCR.\n\n    A PDF is classified as scanned when the average\
          \ number of extractable\n    characters per page falls below *chars_per_page_threshold*,\
          \ which\n    indicates that the pages contain images rather than embedded\
          \ text.\n\n    Parameters\n    ----------\n    input_file              :\
          \ PDF artifact to inspect\n    chars_per_page_threshold: avg chars/page\
          \ below which the doc is\n                              considered scanned\
          \ (default 50)\n\n    Returns\n    -------\n    bool\n        True  - scanned\
          \ document (OCR required)\n        False - digitally-born PDF (OCR not required)\n\
          \    \"\"\"\n    from pypdf import PdfReader\n\n    reader = PdfReader(input_file.path)\n\
          \    num_pages = len(reader.pages)\n\n    if num_pages == 0:\n        print(\"\
          [WARN] PDF has no pages; treating as scanned.\")\n        return True\n\n\
          \    total_chars = 0\n    for i, page in enumerate(reader.pages):\n    \
          \    text = page.extract_text() or \"\"\n        page_chars = len(text.strip())\n\
          \        total_chars += page_chars\n        print(f\"[INFO] Page {i + 1}/{num_pages}:\
          \ {page_chars} chars extracted\")\n\n    avg_chars = total_chars / num_pages\n\
          \    is_scanned = avg_chars < chars_per_page_threshold\n\n    print(\n \
          \       f\"[INFO] Total pages: {num_pages} | \"\n        f\"Total chars:\
          \ {total_chars} | \"\n        f\"Avg chars/page: {avg_chars:.1f} | \"\n\
          \        f\"Threshold: {chars_per_page_threshold} | \"\n        f\"Scanned:\
          \ {is_scanned}\"\n    )\n    return is_scanned\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: detect-scanned-pdf-op
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: detect-scanned-pdf-op
    tasks:
      detect-scanned-pdf-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-detect-scanned-pdf-op
        inputs:
          artifacts:
            input_file:
              componentInputArtifact: input_file
          parameters:
            chars_per_page_threshold:
              componentInputParameter: chars_per_page_threshold
        taskInfo:
          name: detect-scanned-pdf-op
  inputDefinitions:
    artifacts:
      input_file:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
    parameters:
      chars_per_page_threshold:
        defaultValue: 50.0
        description: considered scanned (default 50)
        isOptional: true
        parameterType: NUMBER_INTEGER
  outputDefinitions:
    parameters:
      Output:
        parameterType: BOOLEAN
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
