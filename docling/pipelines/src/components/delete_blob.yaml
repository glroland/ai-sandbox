  dag:
    tasks:
      delete-blob-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-delete-blob-op
        inputs:
          parameters:
            blob_name:
              componentInputParameter: blob_name
            container_name:
              componentInputParameter: container_name
            storage_account:
              componentInputParameter: storage_account
            storage_key:
              componentInputParameter: storage_key
        taskInfo:
          name: delete-blob-op
  inputDefinitions:
    parameters:
      blob_name:
        parameterType: STRING
      container_name:
        parameterType: STRING
      storage_account:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      storage_key:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
