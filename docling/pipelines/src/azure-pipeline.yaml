          \ os\n    from urllib.parse import quote\n    import requests\n\n    def\
          \ _account() -> str:\n        v = storage_account or os.environ.get(\"AZURE_STORAGE_ACCOUNT\"\
          , \"\")\n        if not v:\n            raise EnvironmentError(\"AZURE_STORAGE_ACCOUNT\
          \ is not set\")\n        return v\n\n    def _key() -> str:\n        v =\
          \ storage_key or os.environ.get(\"AZURE_STORAGE_KEY\", \"\")\n        if\
          \ not v:\n            raise EnvironmentError(\"AZURE_STORAGE_KEY is not\
          \ set\")\n        return v\n\n    def _sign(s: str) -> str:\n        raw\
          \ = base64.b64decode(_key())\n        return base64.b64encode(\n       \
          \     hmac.new(raw, s.encode(\"utf-8\"), hashlib.sha256).digest()\n    \
          \    ).decode()\n\n    def _build_headers(method, container, blob=None,\
          \ extra=None, qp=None, clen=\"\"):\n        account = _account()\n     \
          \   utc = datetime.datetime.utcnow().strftime(\"%a, %d %b %Y %H:%M:%S GMT\"\
          )\n        hdrs = {\"x-ms-date\": utc, \"x-ms-version\": \"2025-11-05\"\
          }\n        if extra:\n            hdrs.update(extra)\n        ms = sorted((k.lower(),\
          \ v) for k, v in hdrs.items() if k.lower().startswith(\"x-ms-\"))\n    \
          \    canon_hdrs = \"\".join(f\"{k}:{v}\\n\" for k, v in ms)\n        resource\
          \ = f\"/{account}/{container}\"\n        if blob:\n            resource\
          \ += f\"/{blob}\"\n        if qp:\n            for k in sorted(qp):\n  \
          \              resource += f\"\\n{k}:{qp[k]}\"\n        sts = (\n      \
          \      f\"{method}\\n\\n\\n{clen}\\n\"\n            f\"{hdrs.get('Content-MD5','')}\\\
          n{hdrs.get('Content-Type','')}\\n\"\n            f\"\\n\\n\\n\\n\\n\\n{canon_hdrs}{resource}\"\
          \n        )\n        hdrs[\"Authorization\"] = f\"SharedKey {account}:{_sign(sts)}\"\
          \n        return hdrs\n\n    def _upload_file(local_path: str, blob_name:\
          \ str):\n        with open(local_path, \"rb\") as fh:\n            data\
          \ = fh.read()\n        content_length = str(len(data))\n        account\
          \ = _account()\n        url = f\"https://{account}.blob.core.windows.net/{container_name}/{quote(blob_name,\
          \ safe='/')}\"\n        extra = {\"Content-Type\": \"application/octet-stream\"\
          , \"x-ms-blob-type\": \"BlockBlob\"}\n        headers = _build_headers(\n\
          \            \"PUT\", container_name, blob=blob_name, extra=extra, clen=content_length\n\
          \        )\n        headers[\"Content-Length\"] = content_length\n     \
          \   print(f\"[INFO] Uploading {content_length} bytes -> '{container_name}/{blob_name}'\"\
          )\n        resp = requests.put(url, headers=headers, data=data)\n      \
          \  if not resp.ok:\n            print(f\"[ERROR] upload failed: {resp.status_code}\
          \ {resp.text}\")\n            resp.raise_for_status()\n        print(f\"\
          [INFO] Upload complete: '{blob_name}'\")\n\n    base_dir = input_dir.path\n\
          \    prefix = blob_prefix.rstrip(\"/\")\n    for dirpath, _, filenames in\
          \ os.walk(base_dir):\n        for filename in filenames:\n            local_path\
          \ = os.path.join(dirpath, filename)\n            rel_path = os.path.relpath(local_path,\
          \ base_dir)\n            blob_name = f\"{prefix}/{rel_path}\"\n        \
          \    _upload_file(local_path, blob_name)\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: 'For each blob in *input_container*:

    1. Download the blob.

    2. Run Docling (GPU) to convert it.

    3. Upload the original file to *output_container*.

    4. Upload all Docling output files to *output_container* under the same prefix.

    5. Delete the original blob from *input_container*.'
  name: azure-docling-ingestion-pipeline
root:
  dag:
    tasks:
      for-loop-1:
        componentRef:
          name: comp-for-loop-1
        dependentTasks:
        - list-blobs-op
        inputs:
          parameters:
            pipelinechannel--docling_batch_size:
              componentInputParameter: docling_batch_size
            pipelinechannel--input_container:
              componentInputParameter: input_container
            pipelinechannel--list-blobs-op-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: list-blobs-op
            pipelinechannel--output_container:
              componentInputParameter: output_container
            pipelinechannel--storage_account:
              componentInputParameter: storage_account
            pipelinechannel--storage_key:
              componentInputParameter: storage_key
        iteratorPolicy:
          parallelismLimit: 1
        parameterIterator:
          itemInput: pipelinechannel--list-blobs-op-Output-loop-item
          items:
            inputParameter: pipelinechannel--list-blobs-op-Output
        taskInfo:
          name: for-loop-1
      list-blobs-op:
        cachingOptions: {}
        componentRef:
          name: comp-list-blobs-op
        inputs:
          parameters:
            container_name:
              componentInputParameter: input_container
            storage_account:
              componentInputParameter: storage_account
            storage_key:
              componentInputParameter: storage_key
        taskInfo:
          name: list-blobs-op
  inputDefinitions:
    parameters:
      docling_batch_size:
        defaultValue: '10'
        isOptional: true
        parameterType: STRING
      input_container:
        parameterType: STRING
      output_container:
        parameterType: STRING
      storage_account:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      storage_key:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
