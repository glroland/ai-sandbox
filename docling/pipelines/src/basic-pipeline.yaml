# PIPELINE DEFINITION
# Name: docling-ingestion-pipeline
# Inputs:
#    docling_batch_size: str [Default: '10']
#    source_document_url: str
components:
  comp-download-input-file-step:
    executorLabel: exec-download-input-file-step
    inputDefinitions:
      parameters:
        source_document_url:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        source_document_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-run-docling-step-with-gpu:
    executorLabel: exec-run-docling-step-with-gpu
    inputDefinitions:
      artifacts:
        source_document_path:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        docling_batch_size:
          defaultValue: '4'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        generated_artifacts_path:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-download-input-file-step:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - download_input_file_step
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_input_file_step(source_document_url: str, source_document_path:\
          \ Output[Artifact]):\n    print(\"Downloading Input File...\")\n    print(\"\
          URL: \" + str(source_document_url))\n    print(\"To: \" + str(source_document_path.path))\n\
          \n    import urllib.request\n    urllib.request.urlretrieve(source_document_url,\
          \ source_document_path.path)\n\n    print(\"Source Document Downloaded!\"\
          )\n\n"
        image: python:3.9
    exec-run-docling-step-with-gpu:
      container:
        args:
        - -v
        - --device
        - cuda
        - --from
        - pdf
        - --to
        - md
        - --image-export-mode
        - referenced
        - --ocr
        - --ocr-engine
        - rapidocr
        - --page-batch-size
        - '{{$.inputs.parameters[''docling_batch_size'']}}'
        - --output
        - '{{$.outputs.artifacts[''generated_artifacts_path''].path}}'
        - '{{$.inputs.artifacts[''source_document_path''].path}}'
        command:
        - docling
        image: quay.io/bball/docling-rapidocr-pipeline:1.0
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuLimit: 10.0
          resourceCpuLimit: '10'
pipelineInfo:
  name: docling-ingestion-pipeline
root:
  dag:
    tasks:
      download-input-file-step:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-input-file-step
        inputs:
          parameters:
            source_document_url:
              componentInputParameter: source_document_url
        taskInfo:
          name: download-input-file-step
      run-docling-step-with-gpu:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-run-docling-step-with-gpu
        dependentTasks:
        - download-input-file-step
        inputs:
          artifacts:
            source_document_path:
              taskOutputArtifact:
                outputArtifactKey: source_document_path
                producerTask: download-input-file-step
          parameters:
            docling_batch_size:
              componentInputParameter: docling_batch_size
        taskInfo:
          name: run-docling-step-with-gpu
  inputDefinitions:
    parameters:
      docling_batch_size:
        defaultValue: '10'
        isOptional: true
        parameterType: STRING
      source_document_url:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
