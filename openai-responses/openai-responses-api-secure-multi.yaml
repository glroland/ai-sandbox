apiVersion: v1
kind: ConfigMap
metadata:
  name: openai-responses-api-secure-multi-config
data:
  config.yaml: |
    version: 2
    image_name: rh
    apis:
    - agents
    - inference
    - safety
    - tool_runtime
    - vector_io
    - files
    providers:
      inference:
      - provider_id: gemma-4-vllm-inference
        provider_type: remote::vllm
        config:
          base_url: https://gemma-4-predictor.sandbox.svc.cluster.local:8443/v1
          max_tokens: 5000
          api_token: fake
          tls_verify: false
      - provider_id: tinyllama-vllm-inference
        provider_type: remote::vllm
        config:
          base_url: https://tinyllama-predictor.sandbox.svc.cluster.local:8443/v1
          max_tokens: 500
          api_token: fake
          tls_verify: false
      - provider_id: ${env.VLLM_EMBEDDING_URL:+vllm-embedding}
        provider_type: remote::vllm
        config:
          base_url: ${env.VLLM_EMBEDDING_URL:=}
          max_tokens: ${env.VLLM_EMBEDDING_MAX_TOKENS:=4096}
          api_token: ${env.VLLM_EMBEDDING_API_TOKEN:=fake}
          tls_verify: ${env.VLLM_EMBEDDING_TLS_VERIFY:=true}
      - provider_id: ${env.ENABLE_SENTENCE_TRANSFORMERS:+sentence-transformers}
        provider_type: inline::sentence-transformers
        config: {}
      vector_io:
      - provider_id: milvus
        provider_type: inline::milvus
        config:
          db_path: /opt/app-root/src/.llama/distributions/rh/milvus.db
          persistence:
            backend: kv_default
            namespace: vector_io::milvus
      safety:
        - provider_id: trustyai_fms
          provider_type: remote::trustyai_fms
          module: llama_stack_provider_trustyai_fms==0.3.2
          config:
            orchestrator_url: ${env.FMS_ORCHESTRATOR_URL:=}
            ssl_cert_path: ${env.FMS_SSL_CERT_PATH:=}
            shields: {}
      agents:
      - provider_id: meta-reference
        provider_type: inline::meta-reference
        config:
          persistence:
            agent_state:
              backend: kv_default
              namespace: agents::meta_reference
            responses:
              backend: sql_default
              table_name: agents_responses
              max_write_queue_size: 10000
              num_writers: 4
      tool_runtime:
      - provider_id: rag-runtime
        provider_type: inline::rag-runtime
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
      files:
      - provider_id: meta-reference-files
        provider_type: inline::localfs
        config:
          storage_dir: /opt/app-root/src/.llama/distributions/rh/files
          metadata_store:
            backend: sql_default
            table_name: files_metadata
    storage:
      backends:
        kv_default:
          type: kv_postgres
          host: ${env.POSTGRES_HOST:=localhost}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB:=llamastack}
          user: ${env.POSTGRES_USER:=llamastack}
          password: ${env.POSTGRES_PASSWORD:=llamastack}
          table_name: ${env.POSTGRES_TABLE_NAME:=llamastack_kvstore}
        sql_default:
          type: sql_postgres
          host: ${env.POSTGRES_HOST:=localhost}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB:=llamastack}
          user: ${env.POSTGRES_USER:=llamastack}
          password: ${env.POSTGRES_PASSWORD:=llamastack}
      stores:
        metadata:
          backend: kv_default
          namespace: registry
        inference:
          table_name: inference_store
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          namespace: prompts
          backend: kv_default
    registered_resources:
      models:
      - metadata:
          embedding_dimension: ${env.EMBEDDING_DIMENSION:=768}
        model_id: ${env.EMBEDDING_MODEL:=granite-embedding-125m-english}
        provider_id: ${env.EMBEDDING_PROVIDER:=vllm-embedding}
        provider_model_id: ${env.EMBEDDING_PROVIDER_MODEL_ID:=ibm-granite/granite-embedding-125m-english}
        model_type: embedding
      shields: []
      vector_dbs: []
      datasets: []
      scoring_fns: []
      benchmarks: []
      tool_groups:
      - toolgroup_id: builtin::rag
        provider_id: rag-runtime
    vector_stores:
      annotation_prompt_params:
        enable_annotations: true
        annotation_instruction_template: "Cite sources immediately at the end of sentences using <|file-id|> format."
    telemetry:
      enabled: true
    server:
      port: 8321
---
apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: openai-responses-api-secure-multi
spec:
  replicas: 1
  server:
    containerSpec:
      env:
        - name: VLLM_TLS_VERIFY
          value: 'false'
        - name: ENABLE_SENTENCE_TRANSFORMERS
          value: 'true'
        - name: EMBEDDING_PROVIDER
          value: sentence-transformers
        - name: EMBEDDING_MODEL
          value: granite-embedding-125m-english
        - name: EMBEDDING_PROVIDER_MODEL_ID
          value: ibm-granite/granite-embedding-125m-english
        - name: POSTGRES_HOST
          value: lls-postgresql.sandbox.svc.cluster.local
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: database-name
              name: lls-postgresql
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: database-user
              name: lls-postgresql
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: lls-postgresql
      name: llama-stack
      port: 8321
    userConfig:
      configMapName: openai-responses-api-secure-multi-config
    distribution:
      name: 'rh-dev'
    storage:
      size: 50Gi
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: openai-responses-api-secure-multi
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: openai-responses-api-secure-multi-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
